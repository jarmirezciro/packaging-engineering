<div class="d-flex justify-content-between align-items-start gap-2 mt-1 small">
    <span class="text-muted" data-effective-property-source="{{ property }}">{{ source_label|default:'Not available' }}</span>
    <button type="button" class="btn btn-link btn-sm p-0 text-nowrap" data-restore-property="{{ property }}" {% if not overridden %}hidden{% endif %}>Restore source</button>
</div>
