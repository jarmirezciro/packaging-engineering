{% load static %}
{% if not threejs_importmap_loaded %}
    {% include "shared/_threejs_importmap.html" %}
{% endif %}
<script>
(function () {
    function getRoot(prefix) {
        if (prefix !== undefined && prefix !== null && prefix !== "") {
            return document.getElementById("containerSelectionRoot_" + prefix);
        }
        return document.querySelector('[data-container-tool-root][data-container-prefix=""]')
            || document.getElementById("containerSelectionRoot")
            || document.querySelector('[data-container-tool-root]');
    }
    function getForm(prefix) {
        const root = getRoot(prefix);
        if (root) return root.closest("form");
        return document.querySelector("form");
    }
    function getById(baseId, prefix) {
        return document.getElementById(prefix ? (baseId + "_" + prefix) : baseId);
    }
    function getField(nameBase, prefix) {
        const form = getForm(prefix);
        if (!form) return null;
        const fullName = prefix ? (nameBase + "_" + prefix) : nameBase;
        return form.querySelector('[name="' + fullName + '"]');
    }
    function getCheckedValue(nameBase, prefix, fallbackValue) {
        const form = getForm(prefix);
        if (!form) return fallbackValue;
        const fullName = prefix ? (nameBase + "_" + prefix) : nameBase;
        const checked = form.querySelector('input[name="' + fullName + '"]:checked');
        return checked ? checked.value : fallbackValue;
    }
    function setAction(prefix, value) {
        const field = getField("action", prefix);
        if (field) field.value = value;
    }
    function setHidden(prefix, nameBase, value) {
        const field = getField(nameBase, prefix);
        if (field) field.value = value;
    }
    function submitForm(prefix) {
        const form = getForm(prefix);
        if (form) window.KolliPackToolScroll.submit(form);
    }
    function updateUI(prefix) {
        const modeField = getField("mode", prefix);
        const mode = modeField ? modeField.value : "single";
        const productSource = getCheckedValue("product_source", prefix, "manual");
        const containerSource = getCheckedValue("container_source", prefix, "manual");

        const manualProductFields = getById("manualProductFields", prefix);
        const manualRotationFields = getById("manualRotationFields", prefix);
        const productCatalogueChooser = getById("productCatalogueChooser", prefix);
        const manualDesiredQtyWrap = getById("manualDesiredQtyWrap", prefix);

        const singleContainerControls = getById("singleContainerControls", prefix);
        const optimalContainerControls = getById("optimalContainerControls", prefix);
        const manualContainerFields = getById("manualContainerFields", prefix);
        const globalCatalogueChooser = getById("globalCatalogueChooser", prefix);
        const selectionPackageControls = getById("selectionPackageControls", prefix);
        const designPackagingFields = getById("designPackagingFields", prefix);

        function toggleBlock(block, visible) {
            if (!block) return;
            block.style.display = visible ? "block" : "none";
            block.querySelectorAll("input,select,textarea,button").forEach(function (field) { field.disabled = !visible; });
        }
        toggleBlock(selectionPackageControls, mode !== "design");
        toggleBlock(designPackagingFields, mode === "design");

        if (productSource === "catalogue") {
            if (productCatalogueChooser) productCatalogueChooser.style.display = "block";
            if (manualProductFields) manualProductFields.style.display = "none";
            if (manualRotationFields) manualRotationFields.style.display = "none";
        } else {
            if (productCatalogueChooser) productCatalogueChooser.style.display = "none";
            if (manualProductFields) manualProductFields.style.display = "block";
            if (manualRotationFields) manualRotationFields.style.display = "block";
        }

        if (manualDesiredQtyWrap) {
            manualDesiredQtyWrap.style.display = (mode === "design" || (mode === "optimal" && productSource === "manual")) ? "block" : "none";
        }

        if (mode === "design") return;

        if (mode === "single") {
            if (singleContainerControls) singleContainerControls.style.display = "block";
            if (optimalContainerControls) optimalContainerControls.style.display = "none";
            if (containerSource === "catalogue") {
                if (globalCatalogueChooser) globalCatalogueChooser.style.display = "block";
                if (manualContainerFields) manualContainerFields.style.display = "none";
            } else {
                if (globalCatalogueChooser) globalCatalogueChooser.style.display = "none";
                if (manualContainerFields) manualContainerFields.style.display = "block";
            }
        } else {
            if (singleContainerControls) singleContainerControls.style.display = "none";
            if (optimalContainerControls) optimalContainerControls.style.display = "block";
            if (globalCatalogueChooser) globalCatalogueChooser.style.display = "block";
        }
    }

    window.containerSelectionBrowseProductCatalogue = function (prefix) {
        setHidden(prefix, "selected_product_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionClearSelectedProduct = function (prefix) {
        setHidden(prefix, "selected_product_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionSelectProduct = function (prefix, productId) {
        setHidden(prefix, "selected_product_id", productId);
        setAction(prefix, "select_product");
        submitForm(prefix);
    };
    window.containerSelectionBrowsePackagingCatalogue = function (prefix) {
        setHidden(prefix, "container_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionClearSelectedContainer = function (prefix) {
        setHidden(prefix, "container_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionSelectContainer = function (prefix, containerId) {
        setHidden(prefix, "container_id", containerId);
        setAction(prefix, "select_container");
        submitForm(prefix);
    };
    window.containerSelectionRunSingle = function (prefix) {
        setAction(prefix, "run_single");
        submitForm(prefix);
    };
    window.containerSelectionFindTop5 = function (prefix) {
        setAction(prefix, "find_top5");
        submitForm(prefix);
    };
    window.containerSelectionSelectCandidate = function (prefix, containerId) {
        setHidden(prefix, "container_id", containerId);
        setAction(prefix, "select_candidate");
        submitForm(prefix);
    };
    window.containerSelectionRunDesign = function (prefix) {
        setAction(prefix, "run_design");
        submitForm(prefix);
    };
    window.containerSelectionSelectDesignCandidate = function (prefix, candidateId) {
        setHidden(prefix, "selected_design_candidate_id", candidateId);
        setAction(prefix, "select_design_candidate");
        submitForm(prefix);
    };

    function bindEvents(prefix) {
        updateUI(prefix);
        const form = getForm(prefix);
        if (!form) return;
        if (form.dataset.containerSelectionBound === (prefix || "__standalone__")) return;
        form.dataset.containerSelectionBound = (prefix || "__standalone__");

        const modeField = getField("mode", prefix);
        if (modeField) {
            modeField.addEventListener("change", function () {
                setHidden(prefix, "selected_design_candidate_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        }
        const productSourceName = prefix ? ("product_source_" + prefix) : "product_source";
        const containerSourceName = prefix ? ("container_source_" + prefix) : "container_source";
        const productCatalogueName = prefix ? ("product_catalogue_id_" + prefix) : "product_catalogue_id";
        const packagingCatalogueName = prefix ? ("catalogue_id_" + prefix) : "catalogue_id";

        form.querySelectorAll('input[name="' + productSourceName + '"]').forEach(function (el) {
            el.addEventListener("change", function () {
                setHidden(prefix, "selected_product_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        });
        form.querySelectorAll('input[name="' + containerSourceName + '"]').forEach(function (el) {
            el.addEventListener("change", function () {
                setHidden(prefix, "container_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        });
        const productCatalogueField = form.querySelector('[name="' + productCatalogueName + '"]');
        if (productCatalogueField) {
            productCatalogueField.addEventListener("change", function () {
                setHidden(prefix, "selected_product_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        }
        const packagingCatalogueField = form.querySelector('[name="' + packagingCatalogueName + '"]');
        if (packagingCatalogueField) {
            packagingCatalogueField.addEventListener("change", function () {
                setHidden(prefix, "container_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        }
        form.querySelectorAll(".tool-clickable-row").forEach(function (row) {
            row.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    row.click();
                }
            });
        });
    }

    function bindAllRoots() {
        const roots = document.querySelectorAll('[data-container-tool-root]');
        if (!roots.length) {
            bindEvents("");
            return;
        }
        roots.forEach(function (root) {
            bindEvents(root.dataset.containerPrefix || "");
        });
    }

    document.addEventListener("DOMContentLoaded", bindAllRoots);
})();
</script>

<script type="module" src="{% static 'js/container_threejs_viewer.js' %}?v=20260731-product-shapes"></script>
