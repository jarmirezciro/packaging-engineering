{% load static %}
{% if not threejs_importmap_loaded %}
    {% include "shared/_threejs_importmap.html" %}
{% endif %}
<script>
(function () {
    function getRoot(prefix) {
        if (prefix !== undefined && prefix !== null && prefix !== "") {
            return document.getElementById("containerSelectionRoot_" + prefix);
        }
        return document.querySelector('[data-container-tool-root][data-container-prefix=""]')
            || document.getElementById("containerSelectionRoot")
            || document.querySelector('[data-container-tool-root]');
    }
    function getForm(prefix) {
        const root = getRoot(prefix);
        if (root) return root.closest("form");
        return document.querySelector("form");
    }
    function getById(baseId, prefix) {
        return document.getElementById(prefix ? (baseId + "_" + prefix) : baseId);
    }
    function getField(nameBase, prefix) {
        const form = getForm(prefix);
        if (!form) return null;
        const fullName = prefix ? (nameBase + "_" + prefix) : nameBase;
        return form.querySelector('[name="' + fullName + '"]');
    }
    function getCheckedValue(nameBase, prefix, fallbackValue) {
        const form = getForm(prefix);
        if (!form) return fallbackValue;
        const fullName = prefix ? (nameBase + "_" + prefix) : nameBase;
        const checked = form.querySelector('input[name="' + fullName + '"]:checked');
        return checked ? checked.value : fallbackValue;
    }
    const LB_MSF_TO_GSM = 4.8824276;
    const properties = {
        caliper: {field: "box_thickness_mm", flag: "box_thickness_user_override", kind: "length"},
        grammage: {field: "combined_grammage_g_m2", flag: "grammage_user_override", kind: "density"},
        tare: {field: "box_weight", flag: "box_weight_user_override", kind: "mass"},
        payload: {field: "box_max_payload", flag: "box_max_payload_user_override", kind: "mass"},
        product_weight: {field: "product_weight", flag: "product_weight_user_override", kind: "mass"}
    };
    function advancedData(prefix) {
        const root = getRoot(prefix);
        if (!root) return null;
        if (!root.containerAdvanced) {
            const script = getById("containerAdvancedData", prefix);
            if (!script) return null;
            root.containerAdvanced = JSON.parse(script.textContent);
        }
        return root.containerAdvanced;
    }
    function currentContainerDimensionUnit(prefix) {
        return getField("container_dimension_unit", prefix)?.value || "mm";
    }
    function formatBoardNumber(value, places) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(places).replace(/0+$/, "").replace(/\.$/, "") || "0" : "";
    }
    function propertyIsOverridden(prefix, key) {
        return getField(properties[key].flag, prefix)?.value === "1";
    }
    function showPropertySource(prefix, key, overridden) {
        const root = getRoot(prefix), data = advancedData(prefix);
        if (!root || !data) return;
        const label = root.querySelector('[data-effective-property-source="' + key + '"]');
        if (label) label.textContent = overridden ? "Manual override" : data.baselines[key].label || "Not available";
        const restore = root.querySelector('[data-restore-property="' + key + '"]');
        if (restore) restore.hidden = !overridden;
    }
    function renderProperty(prefix, key) {
        const data = advancedData(prefix), spec = properties[key], input = getField(spec.field, prefix);
        if (!data || !input || (data.errors || []).includes(spec.field)) return;
        const overridden = propertyIsOverridden(prefix, key);
        const value = overridden ? data.effective[key] : data.baselines[key].value;
        if (spec.kind === "density") {
            const imperial = ["in", "ft"].includes(currentContainerDimensionUnit(prefix));
            input.dataset.grammageCanonical = value === null ? "" : String(value);
            input.value = value === null ? "" : formatBoardNumber(value / (imperial ? LB_MSF_TO_GSM : 1), overridden ? 8 : 1);
            getRoot(prefix).querySelectorAll("[data-grammage-unit]").forEach(label => label.textContent = "(" + (imperial ? "lb/MSF" : "g/m²") + ")");
        } else {
            window.KolliPackUnitSelector.setCanonicalValue(input, value, spec.kind === "length" ? "mm" : "g");
            if (!overridden && key === "caliper" && value !== null) {
                input.value = formatBoardNumber(window.KolliPackUnitSelector.fromCanonicalValue(value, currentContainerDimensionUnit(prefix), "length"), currentContainerDimensionUnit(prefix) === "mm" ? 3 : 6);
            }
        }
        showPropertySource(prefix, key, overridden);
        if (key === "product_weight" && data.inherited_product) {
            getRoot(prefix).querySelector('[data-effective-property-source="product_weight"]').textContent = "Previous workflow step";
        }
    }
    function markResultStale(prefix) {
        const root = getRoot(prefix);
        if (!root) return;
        root.querySelectorAll("[data-container-calculated-result]").forEach(function (result) {
            result.dataset.resultStale = "true";
            const notice = result.querySelector("[data-result-stale-notice]");
            if (notice) notice.hidden = false;
            result.querySelectorAll("[data-container-threejs-pdf-button], [data-accept-container-result]").forEach(button => button.disabled = true);
            if (prefix) document.querySelectorAll("[data-workflow-pdf-export]").forEach(function (link) {
                link.removeAttribute("href");
                link.classList.add("disabled");
                link.setAttribute("aria-disabled", "true");
                link.setAttribute("tabindex", "-1");
            });
        });
    }
    function invalidateTareEstimate(prefix) {
        const data = advancedData(prefix);
        if (data && data.baselines.tare.source === "estimated_material" && !propertyIsOverridden(prefix, "tare")) {
            data.baselines.tare = {value: null, source: "estimated_material", label: "Recalculate estimate"};
            renderProperty(prefix, "tare");
        }
    }
    function updateCorrugatedMaterialFields(prefix, changedBoard) {
        const data = advancedData(prefix), field = getField("corrugated_material_id", prefix);
        if (!data) return;
        const selected = field?.options[field.selectedIndex];
        const imperial = ["in", "ft"].includes(currentContainerDimensionUnit(prefix));
        if (field) Array.from(field.options).forEach(function (option) {
            if (!option.dataset.boardName) return;
            const density = Number(option.dataset.grammageGsm), caliper = Number(option.dataset.caliperMm);
            option.textContent = option.dataset.boardName + " — " + option.dataset.boardWall + ", " + option.dataset.boardFlute + "-flute — "
                + formatBoardNumber(density / (imperial ? LB_MSF_TO_GSM : 1), 1) + (imperial ? " lb/MSF" : " g/m²")
                + " — " + (caliper > 0 ? formatBoardNumber(caliper / (imperial ? 25.4 : 1), imperial ? 4 : 2) + (imperial ? " in" : " mm") : "Caliper unavailable");
        });
        if (changedBoard) {
            data.originalBaselines = data.originalBaselines || JSON.parse(JSON.stringify(data.baselines));
            ["caliper", "grammage"].forEach(function (key) {
                if (data.catalogue && data.sku[key] !== null) return;
                const value = Number(selected?.dataset[key === "caliper" ? "caliperMm" : "grammageGsm"]);
                data.baselines[key] = value > 0 ? {value: value, label: "Board construction", source: "construction"}
                    : data.catalogue || field?.value === "custom" ? data.originalBaselines[key] : {value: null, label: "Not available", source: "unavailable"};
            });
            invalidateTareEstimate(prefix);
            markResultStale(prefix);
        }
        Object.keys(properties).forEach(key => renderProperty(prefix, key));
    }
    function applyNewDesignDefaults(prefix) {
        const root = getRoot(prefix);
        const modeField = getField("mode", prefix);
        const materialField = getField("corrugated_material_id", prefix);
        const userSelected = getField("corrugated_material_user_selected", prefix);
        if (!root || root.dataset.newContainerConfig !== "true" || !modeField
            || modeField.value !== "design" || !materialField
            || materialField.value || (userSelected && userSelected.value === "1")) return;
        const option = Array.from(materialField.options || []).find(function (candidate) {
            return candidate.dataset.boardCode === "FEFCO_C_175_140_175";
        });
        if (!option) return;
        materialField.value = option.value;
        updateCorrugatedMaterialFields(prefix, true);
    }
    function setAction(prefix, value) {
        const field = getField("action", prefix);
        if (field) field.value = value;
    }
    function setHidden(prefix, nameBase, value) {
        const field = getField(nameBase, prefix);
        if (field) field.value = value;
    }
    function submitForm(prefix) {
        const form = getForm(prefix);
        if (form) window.KolliPackToolScroll.submit(form);
    }
    function updateUI(prefix) {
        const modeField = getField("mode", prefix);
        const mode = modeField ? modeField.value : "single";
        const productSource = getCheckedValue("product_source", prefix, "manual");
        const containerSource = getCheckedValue("container_source", prefix, "manual");

        const manualProductFields = getById("manualProductFields", prefix);
        const manualRotationFields = getById("manualRotationFields", prefix);
        const productCatalogueChooser = getById("productCatalogueChooser", prefix);
        const manualDesiredQtyWrap = getById("manualDesiredQtyWrap", prefix);

        const singleContainerControls = getById("singleContainerControls", prefix);
        const optimalContainerControls = getById("optimalContainerControls", prefix);
        const manualContainerFields = getById("manualContainerFields", prefix);
        const globalCatalogueChooser = getById("globalCatalogueChooser", prefix);
        const selectionPackageControls = getById("selectionPackageControls", prefix);
        const designPackagingFields = getById("designPackagingFields", prefix);

        function toggleBlock(block, visible) {
            if (!block) return;
            block.style.display = visible ? "block" : "none";
            block.querySelectorAll("input,select,textarea,button").forEach(function (field) { field.disabled = !visible; });
        }
        toggleBlock(selectionPackageControls, mode !== "design");
        toggleBlock(designPackagingFields, mode === "design");

        applyNewDesignDefaults(prefix);
        updateCorrugatedMaterialFields(prefix);

        if (productSource === "catalogue") {
            if (productCatalogueChooser) productCatalogueChooser.style.display = "block";
            if (manualProductFields) manualProductFields.style.display = "none";
            if (manualRotationFields) manualRotationFields.style.display = "none";
        } else {
            if (productCatalogueChooser) productCatalogueChooser.style.display = "none";
            if (manualProductFields) manualProductFields.style.display = "block";
            if (manualRotationFields) manualRotationFields.style.display = "block";
        }

        if (manualDesiredQtyWrap) {
            manualDesiredQtyWrap.style.display = (mode === "design" || (mode === "optimal" && productSource === "manual")) ? "block" : "none";
        }

        if (mode === "design") return;

        if (mode === "single") {
            if (singleContainerControls) singleContainerControls.style.display = "block";
            if (optimalContainerControls) optimalContainerControls.style.display = "none";
            if (containerSource === "catalogue") {
                if (globalCatalogueChooser) globalCatalogueChooser.style.display = "block";
                if (manualContainerFields) manualContainerFields.style.display = "none";
            } else {
                if (globalCatalogueChooser) globalCatalogueChooser.style.display = "none";
                if (manualContainerFields) manualContainerFields.style.display = "block";
            }
        } else {
            if (singleContainerControls) singleContainerControls.style.display = "none";
            if (optimalContainerControls) optimalContainerControls.style.display = "block";
            if (globalCatalogueChooser) globalCatalogueChooser.style.display = "block";
        }
    }

    window.containerSelectionBrowseProductCatalogue = function (prefix) {
        setHidden(prefix, "selected_product_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionClearSelectedProduct = function (prefix) {
        setHidden(prefix, "selected_product_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionSelectProduct = function (prefix, productId) {
        setHidden(prefix, "selected_product_id", productId);
        setAction(prefix, "select_product");
        submitForm(prefix);
    };
    window.containerSelectionBrowsePackagingCatalogue = function (prefix) {
        setHidden(prefix, "container_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionClearSelectedContainer = function (prefix) {
        setHidden(prefix, "container_id", "");
        setAction(prefix, "refresh");
        submitForm(prefix);
    };
    window.containerSelectionSelectContainer = function (prefix, containerId) {
        setHidden(prefix, "container_id", containerId);
        setAction(prefix, "select_container");
        submitForm(prefix);
    };
    window.containerSelectionRunSingle = function (prefix) {
        setAction(prefix, "run_single");
        submitForm(prefix);
    };
    window.containerSelectionFindTop5 = function (prefix) {
        setAction(prefix, "find_top5");
        submitForm(prefix);
    };
    window.containerSelectionSelectCandidate = function (prefix, containerId) {
        setHidden(prefix, "container_id", containerId);
        setAction(prefix, "select_candidate");
        submitForm(prefix);
    };
    window.containerSelectionRunDesign = function (prefix) {
        setAction(prefix, "run_design");
        submitForm(prefix);
    };
    window.containerSelectionSelectDesignCandidate = function (prefix, candidateId) {
        setHidden(prefix, "selected_design_candidate_id", candidateId);
        setAction(prefix, "select_design_candidate");
        submitForm(prefix);
    };

    function bindEvents(prefix) {
        updateUI(prefix);
        const form = getForm(prefix);
        if (!form) return;
        if (form.dataset.containerSelectionBound === (prefix || "__standalone__")) return;
        form.dataset.containerSelectionBound = (prefix || "__standalone__");

        const modeField = getField("mode", prefix);
        if (modeField) {
            modeField.addEventListener("change", function () {
                applyNewDesignDefaults(prefix);
                setHidden(prefix, "selected_design_candidate_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        }
        const root = getRoot(prefix);
        if (!root) return;
        const corrugatedMaterialField = getField("corrugated_material_id", prefix);
        if (corrugatedMaterialField) corrugatedMaterialField.addEventListener("change", function () {
            setHidden(prefix, "corrugated_material_user_selected", "1");
            updateCorrugatedMaterialFields(prefix, true);
        });
        Object.keys(properties).forEach(function (key) {
            const spec = properties[key], input = getField(spec.field, prefix);
            if (!input || input.readOnly) return;
            input.addEventListener("input", function () {
                const data = advancedData(prefix);
                data.errors = (data.errors || []).filter(name => name !== spec.field);
                setHidden(prefix, spec.flag, input.value === "" ? "" : "1");
                if (spec.kind === "density") {
                    data.effective[key] = input.value === "" ? null : Number(input.value) * (["in", "ft"].includes(currentContainerDimensionUnit(prefix)) ? LB_MSF_TO_GSM : 1);
                } else {
                    delete input.dataset.unitCanonicalValue;
                    data.effective[key] = window.KolliPackUnitSelector.getCanonicalValue(input, spec.kind);
                }
                showPropertySource(prefix, key, input.value !== "");
                if (key === "grammage") invalidateTareEstimate(prefix);
                markResultStale(prefix);
            });
            input.addEventListener("change", function () { if (input.value === "") renderProperty(prefix, key); });
        });
        root.querySelectorAll("[data-restore-property]").forEach(function (button) {
            button.addEventListener("click", function () {
                const key = button.dataset.restoreProperty;
                advancedData(prefix).errors = (advancedData(prefix).errors || []).filter(name => name !== properties[key].field);
                setHidden(prefix, properties[key].flag, "");
                renderProperty(prefix, key);
                if (key === "grammage") invalidateTareEstimate(prefix);
                markResultStale(prefix);
            });
        });
        root.addEventListener("input", function (event) {
            if (!event.target.matches('input[type="hidden"]')) markResultStale(prefix);
        });
        root.addEventListener("change", function (event) {
            if (!event.target.matches('input[type="hidden"]')) markResultStale(prefix);
        });
        document.addEventListener("kollipack:unit-changed", function (event) {
            const groups = [getField("container_dimension_unit", prefix), getField("container_mass_unit", prefix), getField("product_mass_unit", prefix)].map(field => field?.dataset.unitGroup);
            if (event.detail && groups.includes(event.detail.group)) updateCorrugatedMaterialFields(prefix);
        });
        const productSourceName = prefix ? ("product_source_" + prefix) : "product_source";
        const containerSourceName = prefix ? ("container_source_" + prefix) : "container_source";
        const productCatalogueName = prefix ? ("product_catalogue_id_" + prefix) : "product_catalogue_id";
        const packagingCatalogueName = prefix ? ("catalogue_id_" + prefix) : "catalogue_id";

        form.querySelectorAll('input[name="' + productSourceName + '"]').forEach(function (el) {
            el.addEventListener("change", function () {
                setHidden(prefix, "selected_product_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        });
        form.querySelectorAll('input[name="' + containerSourceName + '"]').forEach(function (el) {
            el.addEventListener("change", function () {
                setHidden(prefix, "container_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        });
        const productCatalogueField = form.querySelector('[name="' + productCatalogueName + '"]');
        if (productCatalogueField) {
            productCatalogueField.addEventListener("change", function () {
                setHidden(prefix, "selected_product_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        }
        const packagingCatalogueField = form.querySelector('[name="' + packagingCatalogueName + '"]');
        if (packagingCatalogueField) {
            packagingCatalogueField.addEventListener("change", function () {
                setHidden(prefix, "container_id", "");
                setAction(prefix, "refresh");
                submitForm(prefix);
            });
        }
        form.querySelectorAll(".tool-clickable-row").forEach(function (row) {
            row.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    row.click();
                }
            });
        });
    }

    function bindAllRoots() {
        const roots = document.querySelectorAll('[data-container-tool-root]');
        if (!roots.length) {
            bindEvents("");
            return;
        }
        roots.forEach(function (root) {
            bindEvents(root.dataset.containerPrefix || "");
        });
    }

    document.addEventListener("DOMContentLoaded", bindAllRoots);
})();
</script>
