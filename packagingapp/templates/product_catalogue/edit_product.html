{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Edit Product: {{ product.product_id }}</h3>
    <p class="text-muted mb-3">Catalogue: {{ catalogue.name }}</p>

    <div class="card shadow-sm mt-3">
        <div class="card-body">

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-primary">Save Changes</button>
                <a href="{% url 'product_catalogue_detail' catalogue.id %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>
{% endblock %}
