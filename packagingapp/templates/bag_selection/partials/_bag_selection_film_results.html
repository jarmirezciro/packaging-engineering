{% if bag_film_rows or bag_workflow_rows %}
    <dl class="small mb-2">
        {% for label, value in bag_film_rows %}
            <div class="d-flex flex-wrap justify-content-between gap-1"><dt class="text-muted fw-normal">{{ label }}</dt><dd class="mb-1">{{ value }}</dd></div>
        {% endfor %}
        {% for label, value in bag_workflow_rows %}
            <div class="d-flex flex-wrap justify-content-between gap-1"><dt class="text-muted fw-normal">{{ label }}</dt><dd class="mb-1">{{ value }}</dd></div>
        {% endfor %}
    </dl>
{% endif %}
