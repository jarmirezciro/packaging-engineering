{% if scene %}
<div class="container-threejs-panel mt-3">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
        <div class="tool-summary-main me-1"><strong>Interactive 3D result</strong></div>
        <div class="btn-group btn-group-sm" role="group" aria-label="3D view controls">
            <button type="button" class="btn btn-app-outline" data-container-threejs-view="reset">Reset</button>
            <button type="button" class="btn btn-app-outline" data-container-threejs-view="top">Top</button>
            <button type="button" class="btn btn-app-outline" data-container-threejs-view="front">Front</button>
            <button type="button" class="btn btn-app-outline" data-container-threejs-view="side">Side</button>
        </div>
        <label class="form-check form-switch mb-0 ms-auto small"><input class="form-check-input" type="checkbox" checked data-container-threejs-toggle="container"><span class="form-check-label">Show {{ package_label }}</span></label>
    </div>
    {{ scene|json_script:scene_id }}
    <div id="{{ viewer_id }}" class="container-threejs-viewer" data-container-threejs-viewer data-scene-script="{{ scene_id }}"></div>
</div>
<style>
.container-threejs-panel{border:1px solid rgba(15,23,42,.12);border-radius:1rem;padding:.85rem;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);width:100%;max-width:100%;min-width:0;overflow:hidden;box-sizing:border-box}
.container-threejs-viewer{width:100%;max-width:100%;min-width:0;min-height:360px;height:min(52vh,520px);border:1px solid rgba(15,23,42,.1);border-radius:.85rem;overflow:hidden;background:#f8fafc;position:relative;display:block}
.container-threejs-viewer canvas{display:block;width:100%!important;height:100%!important}
</style>
{% endif %}
