{% if scene or live %}
<div class="product-unit-threejs-panel mt-3{% if compact %} product-unit-threejs-panel--compact{% endif %}{% if input_context %} product-unit-threejs-panel--input{% endif %}">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <div class="tool-stat-label mb-0">{{ title|default:"Base product unit" }}</div>
        <div class="d-flex flex-wrap align-items-center gap-2">
            <div class="btn-group btn-group-sm"
                 role="group"
                 aria-label="Base product unit orientation views">
                <button type="button"
                        class="btn btn-app-outline"
                        data-product-unit-threejs-orientation="R1"
                        title="R1 — Length vertical"
                        aria-label="View R1 — Length vertical">R1</button>
                <button type="button"
                        class="btn btn-app-outline"
                        data-product-unit-threejs-orientation="R2"
                        title="R2 — Width vertical"
                        aria-label="View R2 — Width vertical">R2</button>
                <button type="button"
                        class="btn btn-app-outline"
                        data-product-unit-threejs-orientation="R3"
                        title="R3 — Height vertical"
                        aria-label="View R3 — Height vertical">R3</button>
            </div>
            <button type="button"
                    class="btn btn-app-outline btn-sm"
                    data-product-unit-threejs-reset>
                Reset view
            </button>
        </div>
    </div>
    {% if scene %}{{ scene|json_script:scene_id }}{% endif %}
    <div id="{{ viewer_id }}"
         class="product-unit-threejs-viewer"
         data-product-unit-threejs-viewer
         {% if scene %}data-scene-script="{{ scene_id }}"{% endif %}
         {% if live %}
         data-product-unit-live
         data-product-unit-length-input="{{ length_input_name }}"
         data-product-unit-width-input="{{ width_input_name }}"
         data-product-unit-height-input="{{ height_input_name }}"
         data-product-unit-shape-input="{{ shape_input_name }}"
         {% endif %}
         aria-label="Interactive base product unit viewer"></div>
</div>
{% endif %}
